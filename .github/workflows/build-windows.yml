# Fork only (rbousigues88/solidcraft): build a Windows preview of this branch for testing.
# Not part of any pull request to tangency-labs/solidcraft.
name: Build Windows preview
on:
  push:
    branches: [ci/build-windows]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    if: github.repository == 'rbousigues88/solidcraft'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: preview-windows-x64
      - name: Build
        shell: pwsh
        run: cargo build --release --locked -p solidcraft -p solidcraft-cli
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory preview | Out-Null
          Copy-Item target/release/solidcraft.exe, target/release/solidcraft-cli.exe preview/
          git log -5 --format="%h %s" | Out-File preview/COMMITS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: solidcraft-preview-windows-x64
          path: preview/
          retention-days: 14
